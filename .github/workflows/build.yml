name: Java CI with Gradle/Maven
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 26
      uses: actions/setup-java@v4
      with:
        java-version: '26'
        distribution: 'temurin'
    # Gradle 프로젝트인 경우 아래 2줄 활성화
    - name: Build with Gradle
      run: |
        chmod +x gradlew
        ./gradlew shadowJar || ./gradlew assemble || ./gradlew build -x test
    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WeaponMechanics-PR-Jars
        path: '**/build/libs/*.jar'
