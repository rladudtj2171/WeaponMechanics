name: Java CI with Gradle/Maven
on: [push, workflow_dispatch]
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 26
      uses: actions/setup-java@v4
      with:
        java-version: '26'
        distribution: 'temurin'
    # Gradle 프로젝트인 경우 아래 2줄 활성화
    - name: Build with Gradle
      run: |
        chmod +x gradlew
        ./gradlew shadowJar || ./gradlew assemble || ./gradlew build -x test
    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WeaponMechanics-PR-Jars
        path: '**/build/libs/*.jar'
    # --- THE CLOUD RELEASE STEP ---
    - name: Create GitHub Release and Upload JAR
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create ${{ github.ref_name }} \
          **/build/libs/*.jar \
          --title "Release ${{ github.ref_name }}" \
          --notes "Automated cloud release for version ${{ github.ref_name }}."
